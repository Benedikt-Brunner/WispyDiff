# Correctness only: `just test` on macOS and Linux. The performance budgets (`just bench`) stay
# local — shared runners fluctuate too much for timing assertions to mean anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 ships Git 2.43; repo search needs 2.44+.
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: git --version

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Otherwise a red run (or one cancelled by a newer push) rebuilds everything next time.
          cache-on-failure: true
      - uses: taiki-e/install-action@just
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: just test
        if: runner.os == 'macOS'
        run: just test
      - name: just test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a just test

      - name: e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e/logs
          if-no-files-found: ignore
