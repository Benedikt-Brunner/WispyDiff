# Correctness only: `just test` on macOS and Linux. The performance budgets (`just bench`) stay
# local — shared runners fluctuate too much for timing assertions to mean anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Clean CI builds gain nothing from incremental artifacts or debug info; both only cost
  # compile time and cache size. (Overrides `incremental = true` in the fast profile.)
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 ships Git 2.43; repo search needs 2.44+.
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          # What GPUI links against (the UI tests run headless: no display needed).
          sudo apt-get install -y git build-essential libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      - run: git --version

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Otherwise a red run (or one cancelled by a newer push) rebuilds everything next time.
          cache-on-failure: true
      - uses: taiki-e/install-action@just
      # Fails on a stale Cargo.lock, and downloads every crate up front.
      - run: cargo fetch --locked --target "$(rustc --print host-tuple)"
      - run: just test

      - name: test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: target/**/*.log
          if-no-files-found: ignore
