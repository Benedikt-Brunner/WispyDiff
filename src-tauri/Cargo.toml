[package]
name = "wispydiff"
description = "Distraction-free review of stacked GitHub PRs"
edition.workspace = true
version.workspace = true

[lib]
name = "wispydiff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wispy-core = { path = "../crates/wispy-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
# Embeds the WebDriver server used by the e2e and performance suites (release builds too,
# so performance is measured on optimized code).
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
