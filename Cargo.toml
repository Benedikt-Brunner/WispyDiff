[workspace]
resolver = "2"
members = ["crates/wispy-core", "crates/wispy-fixtures", "crates/wispydiff"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Benedikt-Brunner/WispyDiff"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimized, but without the slow LTO / single-codegen-unit link: for trying the app as it really
# feels without waiting for a release build. Performance budgets (`just bench`) use `release`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Keep the core fast in dev builds so `just dev` feels like the real thing.
[profile.dev.package.wispy-core]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
