[workspace]
resolver = "2"
members = ["crates/wispy-core", "crates/wispy-fixtures", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep the core fast in dev builds so `tauri dev` feels like the real thing.
[profile.dev.package.wispy-core]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
